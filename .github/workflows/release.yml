name: Build & Release Android App

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "Menggunakan signing keystore dari GitHub Secrets..."
            echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > release.keystore
          else
            echo "Generating fallback ephemeral release keystore via keytool..."
            keytool -genkeypair -v -keystore release.keystore \
              -alias investowl -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass investowl123 -keypass investowl123 \
              -dname "CN=Investowl, OU=Mobile, O=The Investowl, L=Jakarta, ST=DKI, C=ID"
          fi
          cp release.keystore app/release.keystore || true

      - name: Build Release APK and AAB
        env:
          SIGNING_KEY_STORE_PATH: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'investowl123' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'investowl' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'investowl123' }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Package Artifacts
        id: package_artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="v1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/investowl-android-${VERSION}-release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/investowl-android-${VERSION}-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/investowl-android-${VERSION}-release.aab || true

          ls -la artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_artifacts.outputs.version }}
          name: "The Investowl Android ${{ steps.package_artifacts.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            artifacts/investowl-android-*-release.apk
            artifacts/investowl-android-*-release.aab
          body: |
            # 🚀 The Investowl Native Android Release ${{ steps.package_artifacts.outputs.version }}

            Aplikasi Native Android resmi **The Investowl** (Kotlin + Jetpack Compose) dengan sistem desain Material Design 3 Expressive (Seed `#F9EDE1`).

            ### 📦 Modul & Fitur Unggulan
            - **:feature:home** — Quick Market Monitor, IHSG Summary & Global Ticker Search
            - **:feature:ticker** — Detail Saham 6 Dynamic Tabs & Governance Breadcrumb Engine
            - **:feature:ownership** — Dashboard Kepemilikan Publik KSEI (Balancepos & Statis) & IDX BAE
            - **:feature:konglo** — Matriks 8 Grup Konglomerasi IDX & Interactive Ownership Graph
            - **:feature:foreign** — Foreign Exodus Radar 6-Fase & Sektor Rotation RRG
            - **:feature:whales** — Broker Whales Tracker & Portofolio Akumulasi Broker
            - **:feature:signal** — AI Wyckoff/VCP Signal Scanner, P(WIN) Honest Null & Dynamic Half-Kelly
            - **:feature:backtest** — Multi-Horizon T+1..T+20 Win-Rate & Strategy Validation Lab
            - **:feature:admin** — Manajemen Approval Pengguna & Linux Log Emulator + 9-Job Control
            - **:feature:auth** — Google Credential Manager & Watchlist Room DB Offline-First Sync

            ### 🛡️ Integritas Arsitektur
            - **Multi-Module Gradle** dengan Kotlin DSL + Version Catalog (`libs.versions.toml`)
            - **Security**: Proto DataStore terenkripsi Google Tink (`tink-android`)
            - **Networking**: OkHttp3 disk caching (50MB) + kotlinx.serialization
            - **Omnichannel**: Android App Links untuk `investowl.cugarete.me`
